version: '3.8'

services:
  # -------------------------------------------------------------
  # VPS BOOTSTRAP: Ponto de encontro inicial, STUN e descoberta
  # -------------------------------------------------------------
  vps-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "src/server/vps_bootstrap.js"]
    environment:
      - PORT=4001
      - HOST=0.0.0.0
    ports:
      - "4001:4001"
    networks:
      - mesh-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/status').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 3

  # -------------------------------------------------------------
  # NÓ 1: ALICE (ADMINISTRADORA COM CHAVE DE PUBLICAÇÃO)
  # -------------------------------------------------------------
  node-alice-admin:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "src/node/p2p_node.js"]
    environment:
      - NODE_ID=node-alice-admin
      - HTTP_PORT=5001
      - P2P_PORT=6001
      - ROLE=Administrador
      - USERNAME=alice_admin
      - BOOTSTRAPS=ws://vps-bootstrap:4001
      - AUTO_OPEN=false
      - DATA_DIR=/data
    volumes:
      - alice_data:/data
    ports:
      - "5001:5001"
      - "6001:6001"
    depends_on:
      vps-bootstrap:
        condition: service_healthy
    networks:
      - mesh-net

  # -------------------------------------------------------------
  # NÓ 2: BOB (MODERADOR)
  # -------------------------------------------------------------
  node-bob-moderador:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "src/node/p2p_node.js"]
    environment:
      - NODE_ID=node-bob-moderador
      - HTTP_PORT=5002
      - P2P_PORT=6002
      - ROLE=Moderador
      - USERNAME=bob_moderador
      - BOOTSTRAPS=ws://vps-bootstrap:4001
      - AUTO_OPEN=false
      - DATA_DIR=/data
    volumes:
      - bob_data:/data
    ports:
      - "5002:5002"
      - "6002:6002"
    depends_on:
      vps-bootstrap:
        condition: service_healthy
    networks:
      - mesh-net

  # -------------------------------------------------------------
  # NÓ 3: CARLOS (MEMBRO COMUM)
  # -------------------------------------------------------------
  node-carlos-membro:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "src/node/p2p_node.js"]
    environment:
      - NODE_ID=node-carlos-membro
      - HTTP_PORT=5003
      - P2P_PORT=6003
      - ROLE=Membro
      - USERNAME=carlos_membro
      - BOOTSTRAPS=ws://vps-bootstrap:4001
      - AUTO_OPEN=false
      - DATA_DIR=/data
    volumes:
      - carlos_data:/data
    ports:
      - "5003:5003"
      - "6003:6003"
    depends_on:
      vps-bootstrap:
        condition: service_healthy
    networks:
      - mesh-net

networks:
  mesh-net:
    driver: bridge

volumes:
  alice_data:
  bob_data:
  carlos_data:
