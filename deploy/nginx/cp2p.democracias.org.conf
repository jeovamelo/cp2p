# ==============================================================================
# Nginx Configuration for https://cp2p.democracias.org
# Comunidade Resiliente - Reverse Proxy, WebSockets, HSTS and Rate Limiting
# ==============================================================================

# Definição de mapeamento de Upgrade de WebSocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Zonas de limitação de taxa (Rate Limiting)
limit_req_zone $binary_remote_addr zone=cp2p_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=cp2p_ws_limit:10m rate=60r/s;

# 1. Redirecionamento HTTP (Porta 80) para HTTPS (Porta 443)
server {
    listen 80;
    listen [::]:80;
    server_name cp2p.democracias.org;

    # Desafio ACME Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor Seguro HTTPS (Porta 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cp2p.democracias.org;

    # Certificados TLS gerados via Certbot
    ssl_certificate /etc/letsencrypt/live/cp2p.democracias.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cp2p.democracias.org/privkey.pem;

    # Otimizações TLS e Cifras Modernas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cabeçalhos de Segurança Estritos
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self' https://cp2p.democracias.org; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://cp2p.democracias.org wss://cp2p.democracias.org https: wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self';" always;

    # Oculta versão do Nginx
    server_tokens off;

    # Bloqueio de arquivos ocultos e bases (.env, .db, .git)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(db|sqlite|log)$ {
        deny all;
    }

    # Encaminhamento de WebSockets (/live e /live/network)
    location ~ ^/(live|live/network) {
        limit_req zone=cp2p_ws_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Encaminhamento da API REST
    location /api/ {
        limit_req zone=cp2p_api_limit burst=15 nodelay;
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Health Check
    location /health {
        proxy_pass http://127.0.0.1:5001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Status do Bootstrap / Descoberta P2P
    location /status {
        proxy_pass http://127.0.0.1:4001/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Interface Web e Recursos Estáticos
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Cache de arquivos estáticos (CSS, JS, Imagens, Fontes)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        proxy_pass http://127.0.0.1:5001;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Logs de Acesso e Erro (Sem registrar conteúdos confidenciais)
    access_log /var/log/nginx/cp2p.access.log;
    error_log /var/log/nginx/cp2p.error.log warn;
}
